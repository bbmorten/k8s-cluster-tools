# Keycloak — quay.io/keycloak/keycloak:26.6.
#
# KC_HOSTNAME is the *external* URL Keycloak puts in OIDC discovery as `issuer`.
# The K8s API server compares the JWT `iss` claim against this byte-for-byte,
# so it MUST match the --oidc-issuer-url value you set on the API server.
#
# Default in this lab: https://keycloak.k8s.lab — resolved via /etc/hosts on
# your workstation AND via hostAliases on the kube-apiserver static pod, so
# both the browser and the API server hit the same MetalLB ingress IP.
#
# Why HTTPS (not HTTP): Kubernetes >= 1.30 rejects http:// in
# --oidc-issuer-url with "URL scheme must be https". The lab issues a
# self-signed CA + server cert via create-keycloak-tls.sh and lands the
# server cert in Secret `keycloak-tls` (referenced from the Ingress' tls:
# block below). Keycloak itself still listens on plain HTTP (port 8080) —
# ingress-nginx terminates TLS at the edge, sets X-Forwarded-Proto, and
# Keycloak's KC_PROXY_HEADERS=xforwarded makes the issuer URL https.

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: oidc-provider
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: oidc-provider
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6
          imagePullPolicy: IfNotPresent
          args:
            - start-dev
            - --import-realm
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-db.identity.svc.cluster.local:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: POSTGRES_PASSWORD
            - name: KC_HOSTNAME
              value: https://keycloak.k8s.lab
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_LOG
              value: console
            - name: KC_LOG_LEVEL
              value: INFO
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: identity
  annotations:
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # Force HTTP -> HTTPS redirect so the kube-apiserver (and any browser)
    # never get to the plain endpoint.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - keycloak.k8s.lab
      # Server cert + key applied by create-keycloak-tls.sh.
      secretName: keycloak-tls
  rules:
    - host: keycloak.k8s.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
