# 10 nginx replicas, all mounting the same RWX PVC at /usr/share/nginx/html
# with readOnly: true. Each pod's response identifies itself via the
# Downward API so students can see round-robin behind the Service while the
# served files are byte-identical across pods.
#
# topologySpreadConstraints scatter the replicas across nodes so the demo
# also exercises NFS mount on every worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-shared
  namespace: nfs-demo-shared
  labels:
    app: nginx-shared
spec:
  replicas: 10
  selector:
    matchLabels:
      app: nginx-shared
  template:
    metadata:
      labels:
        app: nginx-shared
    spec:
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nginx-shared
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /version.txt
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: shared-content
            readOnly: true
        - name: nginx-conf
          configMap:
            name: nginx-shared-conf
---
# Tiny nginx config that adds X-Pod / X-Node headers to every response so
# students can see which replica answered. The actual response body comes
# from the shared PVC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-shared-conf
  namespace: nfs-demo-shared
data:
  default.conf: |
    server {
      listen 80 default_server;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      add_header X-Pod "$hostname" always;
      location / {
        try_files $uri $uri/ =404;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-shared
  namespace: nfs-demo-shared
spec:
  type: ClusterIP
  selector:
    app: nginx-shared
  ports:
    - name: http
      port: 80
      targetPort: 80
