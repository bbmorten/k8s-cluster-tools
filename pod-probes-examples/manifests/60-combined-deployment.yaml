apiVersion: apps/v1
kind: Deployment
metadata:
  name: combined
  namespace: pod-probes-demo
  labels:
    app: combined
spec:
  replicas: 2
  selector:
    matchLabels:
      app: combined
  template:
    metadata:
      labels:
        app: combined
    spec:
      containers:
      - name: app
        image: registry.k8s.io/e2e-test-images/agnhost:2.40
        args:
        - netexec
        - --http-port=8080
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: combined
  namespace: pod-probes-demo
spec:
  selector:
    app: combined
  ports:
  - port: 80
    targetPort: http
