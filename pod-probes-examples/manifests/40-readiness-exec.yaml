apiVersion: v1
kind: Pod
metadata:
  name: readiness-exec
  namespace: pod-probes-demo
  labels:
    app: readiness-demo
    test: readiness
spec:
  containers:
  - name: readiness
    image: registry.k8s.io/busybox:1.27.2
    args:
    - /bin/sh
    - -c
    - sleep 20; touch /tmp/ready; sleep 600
    readinessProbe:
      exec:
        command:
        - cat
        - /tmp/ready
      initialDelaySeconds: 5
      periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-demo
  namespace: pod-probes-demo
spec:
  selector:
    app: readiness-demo
  ports:
  - port: 80
    targetPort: 80
