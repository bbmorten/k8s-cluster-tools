apiVersion: v1
kind: Pod
metadata:
  name: tcp-probe
  namespace: pod-probes-demo
  labels:
    test: liveness
    probe: tcp
spec:
  containers:
  - name: tcp
    image: registry.k8s.io/e2e-test-images/agnhost:2.40
    args:
    - netexec
    - --http-port=8080
    ports:
    - name: http
      containerPort: 8080
    readinessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    livenessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 20
