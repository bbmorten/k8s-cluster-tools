---
# Simple playbook to update and upgrade all hosts
# Run with: ansible-playbook -i inventory/nodes.ini apt-update-upgrade.yaml
#
# To automatically reboot if needed, add: -e "perform_reboot=yes"
# Example: ansible-playbook -i inventory/nodes.ini apt-update-upgrade.yaml -e "perform_reboot=yes"

- name: Update and upgrade all cluster hosts
  hosts: k8s_cluster
  become: true
  gather_facts: true
  any_errors_fatal: true

  tasks:
    - name: Check for apt locks
      shell: |
        lsof /var/lib/dpkg/lock-frontend || echo "No locks found"
        lsof /var/lib/apt/lists/lock || echo "No locks found"
        lsof /var/cache/apt/archives/lock || echo "No locks found"
        lsof /var/lib/dpkg/lock || echo "No locks found"
      register: apt_locks
      changed_when: false
      ignore_errors: true

    - name: Wait for apt locks to be released
      shell: |
        while lsof /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || lsof /var/lib/apt/lists/lock >/dev/null 2>&1 || lsof /var/cache/apt/archives/lock >/dev/null 2>&1 || lsof /var/lib/dpkg/lock >/dev/null 2>&1; do
          echo "Waiting for apt locks to be released..."
          sleep 10
        done
      when: apt_locks.rc == 0
      changed_when: false

    - name: Update apt cache
      # No cache_valid_time: this playbook is the "patch the nodes" tool, so
      # always refresh indices even if another step touched the cache minutes ago.
      apt:
        update_cache: yes
      register: apt_update_result
      retries: 5
      delay: 30
      until: apt_update_result is success

    - name: Upgrade all packages
      apt:
        upgrade: full
        autoremove: yes
        autoclean: yes
        force_apt_get: yes
      register: apt_upgrade_result
      retries: 5
      delay: 30
      until: apt_upgrade_result is success

    - name: Show package upgrade summary
      debug:
        msg: "{{ apt_upgrade_result.stdout_lines | default(['No upgrades performed']) }}"
      when: apt_upgrade_result.stdout_lines is defined

    - name: Check if system requires a reboot
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Notify if reboot is required
      debug:
        msg: "System requires a reboot"
      when: reboot_required.stat.exists

    - name: Reboot the system if required
      # Non-interactive: pass -e perform_reboot=yes to actually reboot.
      # Without that flag, /var/run/reboot-required is reported but no reboot occurs.
      reboot:
        msg: "Reboot initiated by Ansible due to package upgrades"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when:
        - reboot_required.stat.exists
        - (perform_reboot | default('no') | lower) in ['yes', 'true']
