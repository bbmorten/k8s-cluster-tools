---
# Simple playbook to update and upgrade all hosts
# Run with: ansible-playbook -i inventory/nodes.ini apt-update-upgrade.yaml
# 
# To automatically reboot if needed, add: -e "perform_reboot=yes"
# Example: ansible-playbook -i inventory/nodes.ini apt-update-upgrade.yaml -e "perform_reboot=yes"

- name: Update and upgrade all hosts
  hosts: all
  become: true
  gather_facts: true
  
  tasks:
    - name: Normalize Ubuntu apt sources to archive.ubuntu.com/ubuntu
      ansible.builtin.replace:
        path: /etc/apt/sources.list.d/ubuntu.sources
        regexp: '{{ item.from }}'
        replace: '{{ item.to }}'
      loop:
        - { from: 'http://[a-z]{2}\.archive\.ubuntu\.com/ubuntu/?', to: 'http://archive.ubuntu.com/ubuntu/' }
        - { from: 'http://security\.ubuntu\.com/ubuntu/?', to: 'http://archive.ubuntu.com/ubuntu/' }

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Hold trivy (upstream repo index references deleted .deb files)
      ansible.builtin.dpkg_selections:
        name: trivy
        selection: hold
      failed_when: false

    - name: Upgrade all packages
      apt:
        upgrade: yes
        update_cache: no
        cache_valid_time: 3600
        autoremove: yes
        lock_timeout: 300
      register: upgrade_result
      
    - name: Show upgrade results
      debug:
        msg: "{{ upgrade_result.stdout_lines | default(['No changes made']) }}"
      when: upgrade_result.stdout_lines is defined
      
    - name: Show if system requires a reboot
      stat:
        path: /var/run/reboot-required
      register: reboot_required
      
    - name: Notify if reboot is required
      debug:
        msg: "System requires a reboot"
      when: reboot_required.stat.exists
      
    - name: Reboot the system if required
      # Non-interactive: pass -e perform_reboot=yes to actually reboot.
      # Without that flag, /var/run/reboot-required is reported but no reboot occurs.
      reboot:
        msg: "Reboot initiated by Ansible due to package upgrades"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when:
        - reboot_required.stat.exists
        - (perform_reboot | default('no') | lower) in ['yes', 'true']
