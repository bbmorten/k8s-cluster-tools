---
# HTTPS at the edge AND HTTPS to the pod (re-encrypt).
# backend-protocol=HTTPS tells ingress-nginx to dial the upstream over TLS.
# Upstream cert verification is OFF by default, which is what we want for the
# self-signed pod cert. To turn it on you'd add:
#   nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
#   nginx.ingress.kubernetes.io/proxy-ssl-secret: "<ns>/<ca-secret>"
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: test-ingress-2
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - test-ingress-2.example.com
      secretName: example-tls
  rules:
    - host: test-ingress-2.example.com
      http:
        paths:
          - path: /a
            pathType: Prefix
            backend:
              service:
                name: web-a
                port:
                  number: 443
          - path: /b
            pathType: Prefix
            backend:
              service:
                name: web-b
                port:
                  number: 443
          - path: /c
            pathType: Prefix
            backend:
              service:
                name: web-c
                port:
                  number: 443
