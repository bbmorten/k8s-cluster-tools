---
# Service type: ExternalName.
#
# Does NOT proxy traffic. CoreDNS returns a CNAME record pointing the Service's
# in-cluster DNS name at the configured `externalName`. From a pod's POV the
# external host looks like a normal Service.
#
# This is the way to give workloads a stable in-cluster name for an off-cluster
# dependency (managed RDS, a SaaS API, a legacy on-prem host) without writing
# the real hostname into every Deployment.
#
# Note: `selector` and `ports` are ignored / not allowed -- there's no kube-proxy
# rule, only a DNS record. TLS / SNI uses whatever the externalName resolves to,
# so the client still has to validate the real cert (example.com here).
#
# Test from inside the cluster:
#   kubectl -n svc-types-demo run dns --rm -it --image=busybox:1.36 --restart=Never -- \
#     nslookup web-external.svc-types-demo.svc.cluster.local
#   # Expected: a CNAME line pointing to example.com, plus the resolved A record.
#
#   kubectl -n svc-types-demo run curl --rm -it --image=curlimages/curl --restart=Never -- \
#     curl -sI http://web-external/
#   # Note: this works only if the upstream serves the request for the Host
#   # header `web-external`. example.com will return 404 -- that's correct.
apiVersion: v1
kind: Service
metadata:
  name: web-external
  namespace: svc-types-demo
  labels:
    svc-type: externalname
spec:
  type: ExternalName
  externalName: example.com
